[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-blast-radius"
version = "0.1.0"
description = "Computes IAM privilege reachability to show which least-privilege roles still reach administrative actions."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Nilay Dave" }]
keywords = ["aws", "iam", "cloud-security", "least-privilege", "blast-radius", "cspm"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3.11",
  "Topic :: Security",
]
dependencies = [
  "networkx>=3.2",
  "duckdb>=1.0",
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "pydantic>=2.6",
  "typer>=0.12",
  "jinja2>=3.1",
  "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6", "httpx>=0.27"]

[project.scripts]
ibr = "ibr.cli:app"

[project.urls]
Homepage = "https://github.com/__GITHUB_USERNAME__/iam-blast-radius"
Documentation = "https://__GITHUB_USERNAME__.github.io/iam-blast-radius/"
Issues = "https://github.com/__GITHUB_USERNAME__/iam-blast-radius/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]

[tool.ruff]
line-length = 120
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"src/ibr/cli.py" = ["B008"]
"src/ibr/api/service.py" = ["B008"]
"tests/*" = ["E501"]

[tool.coverage.run]
source = ["src/ibr"]
branch = true
