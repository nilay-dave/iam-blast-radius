name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Lint
        run: ruff check src tests tools benchmark scripts
      - name: Test
        run: pytest --cov=ibr --cov-report=term-missing --cov-report=xml --cov-fail-under=90
      - name: Every declared dependency is used
        if: matrix.python-version == '3.13'
        run: python tools/check_dependencies.py
      - name: Report colour contrast
        if: matrix.python-version == '3.13'
        run: python tools/check_contrast.py
      - name: Upload coverage xml
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@v4
        with:
          name: coverage-xml
          path: coverage.xml

  numbers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Measure
        run: |
          pytest --cov=ibr --cov-report=xml -q
          python benchmark/run_benchmark.py --sizes 200 --repeats 1
          python tools/collect_metrics.py
      - name: Check published numbers
        run: python tools/check_numbers.py

  self-analysis:
    # The tool analyses its own generated account, so a change that breaks the
    # analysis path fails CI even if the unit tests still pass.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Generate and analyse
        run: |
          ibr generate --principals 2000 --out data/generated/ci.json --seed 7
          ibr analyse --account data/generated/ci.json \
            --out docs/report.html --json docs/reachability.json
      - name: The gate must fail on an account with known escalations
        # A gate that cannot fail is not a gate.
        run: |
          if ibr gate --account data/generated/ci.json --max-one-hop 0 --max-mislabelled-pct 0; then
            echo "gate passed an account with known one hop escalations"
            exit 1
          fi
      - name: The gate must pass with the thresholds raised
        run: ibr gate --account data/generated/ci.json --max-one-hop 5000 --max-mislabelled-pct 100
      - uses: actions/upload-artifact@v4
        with:
          name: reachability-report
          path: |
            docs/report.html
            docs/reachability.json

  image:
    # Built and started here rather than in the development environment, which
    # cannot reach a container registry. tests/test_dockerfile.py asserts the
    # file's properties; this asserts the image actually works.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: iam-blast-radius:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: The image runs and reports its version
        run: docker run --rm iam-blast-radius:ci --version
      - name: The image runs as a non root user
        run: |
          uid=$(docker run --rm --entrypoint id iam-blast-radius:ci -u)
          test "$uid" = "10001" || { echo "image runs as uid $uid, expected 10001"; exit 1; }
      - name: The image analyses a mounted account read only
        run: |
          mkdir -p out
          docker run --rm --read-only -v "$PWD/out:/data" iam-blast-radius:ci \
            generate --principals 200 --out /data/account.json --seed 7 || true
          docker run --rm -v "$PWD/out:/data" iam-blast-radius:ci \
            generate --principals 200 --out /data/account.json --seed 7
          docker run --rm --read-only -v "$PWD/out:/data:ro" iam-blast-radius:ci \
            analyse --account /data/account.json
      - name: The service answers a health check
        run: |
          docker run -d --name ibr -p 8000:8000 -v "$PWD/out:/data:ro" iam-blast-radius:ci \
            serve --account /data/account.json --host 0.0.0.0
          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/health; then break; fi
            sleep 1
          done
          curl -fsS http://127.0.0.1:8000/summary
          docker rm -f ibr

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - name: Install
        run: pip install -e ".[dev]"
      - name: Audit the repository's own provenance signals
        run: python scripts/provenance_check.py
