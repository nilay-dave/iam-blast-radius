name: coverage-badge

# Writes a shields.io endpoint JSON to the gh-pages branch so the README badge
# shows the coverage percentage actually measured by the last run on main. No
# third party service and no token beyond GITHUB_TOKEN.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install
        run: pip install -e ".[dev]"

      - name: Measure coverage
        id: cov
        run: |
          pytest --cov=ibr --cov-report=xml -q
          PCT=$(python -c "import xml.etree.ElementTree as ET; print(round(float(ET.parse('coverage.xml').getroot().get('line-rate'))*100,1))")
          echo "pct=$PCT" >> "$GITHUB_OUTPUT"
          if   (( $(echo "$PCT >= 90" | bc -l) )); then echo "colour=brightgreen" >> "$GITHUB_OUTPUT"
          elif (( $(echo "$PCT >= 75" | bc -l) )); then echo "colour=yellow"      >> "$GITHUB_OUTPUT"
          else                                          echo "colour=red"         >> "$GITHUB_OUTPUT"
          fi

      - name: Measure the headline number
        id: analysis
        run: |
          python benchmark/run_benchmark.py --sizes 50000 --repeats 1
          python tools/collect_metrics.py
          echo "halfcost=$(python -c "import json;print(json.load(open('docs/metrics.json'))['analysis']['blanket_cut_cost']['0.5'])")" >> "$GITHUB_OUTPUT"

      - name: Write endpoint files
        run: |
          mkdir -p badges
          cat > badges/coverage.json <<JSON
          {"schemaVersion":1,"label":"coverage","message":"${{ steps.cov.outputs.pct }}%","color":"${{ steps.cov.outputs.colour }}"}
          JSON
          cat > badges/mislabelled.json <<JSON
          {"schemaVersion":1,"label":"least-privilege roles reaching admin (simulated)","message":"${{ steps.analysis.outputs.mislabelled }}%","color":"a3251c"}
          JSON

      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./badges
          destination_dir: badges
          keep_files: true
